version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore
      include: scope
    # codeql-action/init and /analyze must share one version; separate PRs fail
    # Analyze with "Loaded a configuration file for version X, but running Y".
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
