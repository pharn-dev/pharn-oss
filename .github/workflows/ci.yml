name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Job-level block replaces the workflow-level one above, so it repeats contents: read and adds
    # pull-requests: read — the accept label, read by the pharn-ci step below in test-integrity: block.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install
        id: install
        run: npm ci
      # Run each gate independently so one failure can't mask the others, but skip
      # them cleanly if install failed — no cascade of misleading "deps missing" errors.
      - name: Format check
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run format:check
      - name: Markdown lint
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run lint:md
      - name: Lint
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Validate floor
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: node pharn/floor/validate.mjs .
      - name: Docs drift check
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run docs:check
      - name: Specified-marker check
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run check:markers
      - name: Version badge check
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run check:badge
      - name: CHANGELOG version-record check
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run check:changelog
      # Pull requests only: it compares the PR's CHANGELOG with its BASE, and a push to main has none.
      # HEAD is GitHub's test merge commit, so HEAD^1 is the base this PR merges onto, by construction —
      # deepening the fetch by one commit makes it readable. $GITHUB_SHA is the runner's own environment
      # variable; nothing is interpolated into `run:`. Dependabot PRs add no entry and are exempt.
      - name: CHANGELOG per-PR entry check
        if: ${{ always() && steps.install.outcome == 'success' && github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: |
          git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
          node .dev/floor/check-changelog-entry.mjs --base-ref HEAD^1
      # Pull requests only, on the same base (HEAD^1 of GitHub's test merge commit, so only this PR's own diff counts,
      # never what a merge from main brought in): a PR that changes a bump-triggering product path (CLAUDE.md,
      # "SKILLS_VERSION discipline") must change SKILLS_VERSION too. No Dependabot exemption: such a PR touches no
      # product path, so it is GREEN.
      - name: SKILLS_VERSION surface-bump check
        if: ${{ always() && steps.install.outcome == 'success' && github.event_name == 'pull_request' }}
        run: |
          git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
          node .dev/floor/check-surface-bump.mjs --base-ref HEAD^1
      # Pull requests only, on the same base (HEAD^1 of GitHub's test merge commit): a PR that changes a bump-triggering
      # product path (the four human-only trusted docs aside) must carry a /pharn-dev-ship record of a GREEN run — a
      # .dev/features/<name>/SHIP.md verdict block plus the verify and regression reports beside it — and no record in it
      # may show a run that stopped on a red floor verdict (.dev/floor/check-ship-record.mjs; presence and agreement,
      # never coverage or provenance — its header). No Dependabot exemption: such a PR touches no product path.
      - name: Dev-chain record check
        if: ${{ always() && steps.install.outcome == 'success' && github.event_name == 'pull_request' }}
        run: |
          git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
          node .dev/floor/check-ship-record.mjs --base-ref HEAD^1
      # Pull requests only, on the same base as the step above (HEAD^1 of GitHub's test merge commit): the bytes this PR
      # adds to the always-loaded instruction set (CLAUDE.md here) against pharn.config.json's budget AT THE BASE (default
      # 2048). A floor verdict over instruction-files-core.mjs's model of the loader, never the loader (pharn/LIMITS.md §3e).
      - name: Instruction-growth check
        if: ${{ always() && steps.install.outcome == 'success' && github.event_name == 'pull_request' }}
        run: |
          git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
          node pharn/floor/check-instruction-files.mjs --growth --base HEAD^1
      - name: CONTRIBUTING gate-chain check
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run check:contributing
      # In CI this step reports NO_BASELINE and exits 0, green by construction: a fresh checkout has never
      # anchored a reconciliation epoch and holds no uncommitted change. It is wired so CI runs the same command
      # as `npm run check`. Its no-baseline fallback (the always-reconciled control surface compared with
      # committed blob ids) only catches something in a dirty local tree.
      - name: Bash-write reconciliation check
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run check:reconcile
      # Builds `git archive` of HEAD with codeload's `pharn-oss-<sha>/` root and walks it with pharn-cli's extractor
      # rules (entry types, ustar paths, path characters, entry and size limits), so a commit the CLI cannot unpack
      # fails this job and release.yml never tags it. A port of the CLI's rules, not the CLI (.dev/floor/check-source-archive.mjs).
      - name: Source-archive check
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run check:archive
      # Runs the real pharn-cli over HEAD's archive instead of trusting a port of its rules (CORE-384). verify-archive
      # does with the tarball what an install does: unpacks the manifest-listed paths, checks each listed file's sha256,
      # builds the capability index and parses MIN_CLI, offline and in a temp dir; exit 1 names the entry and the rule.
      # It needs one root directory, hence --prefix. Since pharn-cli 0.21.6 the CLI skips unlisted entries, so a bad
      # entry outside the manifest (a symlink under .dev/) passes here: the source-archive check above catches it, for
      # the older CLIs MIN_CLI still admits. Pinned to 0.22.0 exactly, the first release with verify-archive: MIN_CLI
      # (0.14.0) lacks the command, and @latest would let a CLI release change this verdict on an unchanged commit.
      - name: Install check (pharn-cli verify-archive)
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: |
          git archive --prefix=pharn-oss/ --format=tar.gz -o "$RUNNER_TEMP/pharn-oss.tar.gz" HEAD
          npx --yes @pharn-dev/pharn@0.22.0 verify-archive "$RUNNER_TEMP/pharn-oss.tar.gz" --expect-version "$(cat SKILLS_VERSION)"
      - name: Test
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run test:coverage
      - name: PR number for pharn-ci comment
        if: ${{ always() && steps.install.outcome == 'success' && github.event_name == 'pull_request' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > pr-number
      - name: Upload coverage for pharn-ci comment
        if: ${{ always() && steps.install.outcome == 'success' && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pharn-ci-input
          path: |
            coverage/lcov.info
            pr-number
      - id: pharn-ci
        name: pharn-ci diff coverage gate
        if: ${{ always() && steps.install.outcome == 'success' && github.event_name == 'pull_request' }}
        uses: pharn-dev/pharn-ci@a370515e32f8040771ccf4b6f737d3d25f62749f # v0.12.0
        timeout-minutes: 5
        with:
          comment: false
          # A weakened test (deleted, skipped, focused, or a loosened script, workflow or config) fails the check;
          # a reviewer who is not the PR author signs it off with the pharn/accepted label.
          test-integrity: block
      - name: Upload pharn-ci report
        if: ${{ always() && steps.pharn-ci.outputs.report-path != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pharn-ci-report
          path: ${{ steps.pharn-ci.outputs.report-path }}
