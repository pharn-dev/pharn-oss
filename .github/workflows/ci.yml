name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install
        id: install
        run: npm ci
      # Run each gate independently so one failure can't mask the others, but skip
      # them cleanly if install failed — no cascade of misleading "deps missing" errors.
      - name: Format check
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run format:check
      - name: Markdown lint
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run lint:md
      - name: Lint
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Validate floor
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: node pharn/floor/validate.mjs .
      - name: Docs drift check
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run docs:check
      - name: Specified-marker check
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run check:markers
      - name: Version badge check
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run check:badge
      - name: CHANGELOG version-record check
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run check:changelog
      - name: CONTRIBUTING gate-chain check
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm run check:contributing
      - name: Test
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: npm test
