name: gitleaks

# Secret-scanning gate (defense-in-depth). SECURITY.md states this repo holds "no
# secrets"; this job keeps that true by failing the build if a credential is ever
# committed, before it reaches main. gitleaks is a deterministic regex scanner — the
# same primitive the floor calls "regex for a hardcoded secret" (ARCHITECTURE.md §2) —
# but it lives in CI and scans THIS repo, so it is repo hygiene, not part of
# PHARN's floor (pharn/floor/validate.mjs) and not a P0 guarantee about the PHARN being built.
#
# Runs the open-source gitleaks BINARY pinned by version + SHA-256, rather than the
# gitleaks-action (which gates organization use behind a license key). This mirrors the
# repo convention of pinning third-party code by digest, never a floating tag.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      # Bump these two together. GITLEAKS_SHA256 is the linux_x64 line from the
      # release's gitleaks_<version>_checksums.txt — re-verify it on every bump.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so the scan covers every commit, not just the tip
          persist-credentials: false
      # Extracted into $RUNNER_TEMP, NOT into the checkout. The binary and its archive are untracked AND
      # not gitignored, so unpacking them at the repo root left two stray files in the worktree — which
      # pharn/floor/check-bash-reconcile.mjs correctly reports as writes the guards would have denied.
      # Keeping build tooling out of the tree is the fix; adding them to .gitignore would have hidden the
      # signal instead of removing the cause.
      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --status
          tar -xzf "$archive" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" version
      - name: Scan git history for secrets
        run: |
          "${RUNNER_TEMP}/gitleaks" git --redact --verbose .
