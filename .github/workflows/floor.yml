name: floor

# Runs the deterministic floor (P0) on every PR and on push to main.
# Uses `pull_request` (NOT pull_request_target) and grants no write and no
# secrets: a fork PR's untrusted markdown (threat B surface #6/#7) can never
# exfiltrate anything or mutate the repo from here.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Pinned to the major ci.yml runs, never `lts/*`: the floor needs Node >= 24.2,
          # and a floating alias moves the suite to a new major unannounced.
          node-version: 24
      - name: Unit tests (hook + floor)
        # `npm test` itself, so the file set IS package.json's (`.claude/hooks/*`, never
        # `.claude/**`, which would also collect every sibling `.claude/worktrees/**`
        # checkout). It runs on Node stdlib alone: no `npm ci` here, by design.
        run: npm test
      - name: Validate floor
        run: node pharn/floor/validate.mjs .
